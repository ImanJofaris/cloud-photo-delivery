          description: Invoice provider reference for `invoice.paid`.
        amountCents:
          type: integer
        currency:
          type: string
        paidAt:
          type: string
          format: date-time
    AdminStats:
      type: object
      required: [users, events, photos, storageBytes, revenueCents, subscriptions]
      properties:
        users:
          type: integer
          format: int64
        events:
          type: integer
          format: int64
          description: Non-deleted events.
        photos:
          type: integer
          format: int64
          description: Photos excluding failed uploads.
        storageBytes:
          type: integer
          format: int64
          description: Sum of tenant storage counters.
        revenueCents:
          type: integer
          format: int64
          description: Sum of paid invoices.
        subscriptions:
          type: integer
          format: int64
          description: Non-terminal subscriptions (trialing, active, past_due).
    AdminStatsEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AdminStats"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    AdminUser:
      type: object
      required: [id, email, isAdmin, storageBytes, eventCount, createdAt]
