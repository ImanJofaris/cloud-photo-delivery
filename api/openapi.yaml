          format: uuid
        email:
          type: string
        businessName:
          type: string
        isAdmin:
          type: boolean
        storageBytes:
          type: integer
          format: int64
        eventCount:
          type: integer
          format: int64
          description: Non-deleted events owned by the account.
        createdAt:
          type: string
          format: date-time
    AdminUserList:
      type: object
      required: [users, nextCursor]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        nextCursor:
          type: ["string", "null"]
    AdminUserListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AdminUserList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    AdminSubscription:
      type: object
      required: [id, userId, planId, status, interval, cancelAtPeriodEnd, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
        planId:
          type: string
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        interval:
          type: string
        currentPeriodEnd:
          type: ["string", "null"]
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AdminSubscriptionList:
      type: object
      required: [subscriptions, nextCursor]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/AdminSubscription"
        nextCursor:
          type: ["string", "null"]
    AdminSubscriptionListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AdminSubscriptionList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    AdminQueueHealth:
      type: object
      required: [pending, running, failed]
      properties:
        pending:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        oldestPendingAt:
          type: ["string", "null"]
          format: date-time
    AdminHealth:
      type: object
      required: [status, queueDepth, queue, checkedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        queueDepth:
          type: integer
          format: int64
          description: Pending plus running jobs.
        queue:
          $ref: "#/components/schemas/AdminQueueHealth"
        checkedAt:
          type: string
          format: date-time
    AdminHealthEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AdminHealth"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
