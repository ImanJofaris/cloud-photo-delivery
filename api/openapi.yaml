openapi: 3.1.0
info:
  title: Cloud Photo Delivery API
  version: 0.7.0
  description: API-first backend for the Cloud Photo Delivery SaaS.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Events
  - name: Uploads
  - name: Devices
  - name: Public Gallery
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe (checks database)
      security: []
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready

  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Register a new operator account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "423":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/password/reset-request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset email (always returns 200)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/password/reset-confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /account/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /account/branding:
    get:
      tags: [Account]
      operationId: getBranding
      summary: Get the authenticated operator's branding
      description: |
        Returns the tenant's branding. When no branding has been configured the
        string fields are null. Asset keys are replaced by short-lived signed
        URLs. Empty string inputs clear a field on update.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Account]
      operationId: updateBranding
      summary: Update the authenticated operator's branding
      description: |
        Partial update: omitted fields are left unchanged; sending an empty
        string clears the field. `logoKey`/`profileImageKey` must come from
        `POST /account/branding/assets`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdateRequest"
      responses:
        "200":
          description: Updated branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error (invalid color, email, URL, or asset key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /account/branding/assets:
    post:
      tags: [Account]
      operationId: createBrandingAssetUpload
      summary: Presign an upload for a branding asset
      description: |
        Returns a presigned PUT URL and the object key for a logo or profile
        image. Upload the bytes straight to storage, then set the key via
        `PATCH /account/branding`. Allowed types are PNG, JPEG, and WebP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingAssetRequest"
      responses:
        "201":
          description: Presigned upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingAssetEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Unsupported asset kind or content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events:
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSettingsEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "402":
          description: Active event limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    get:
      tags: [Events]
      operationId: listEvents
      summary: List the authenticated operator's events
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: q
          in: query
          description: Case-insensitive search on the event name
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid status or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get one event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update event fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Soft delete an event
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/archive:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Events]
      operationId: archiveEvent
      summary: Archive an event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Archived event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/settings:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventSettings
      summary: Get an event's gallery settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettingsEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Events]
      operationId: updateEventSettings
      summary: Update an event's gallery settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettingsEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/dashboard:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventDashboard
      summary: Get an event's dashboard aggregates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDashboardEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/url:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventPublicURL
      summary: Get the event's canonical public gallery URL
      description: |
        Returns the URL encoded into the event's QR codes:
        `<PUBLIC_BASE_URL>/e/{slug}`. Never a signed URL.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Canonical public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventURLEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/qr.png:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventQRPNG
      summary: Download the event's QR code as a PNG
      description: |
        Encodes the canonical public gallery URL. `size` is the image width and
        height in pixels; values are clamped to 64–2048 (default 512). Only the
        owning operator can fetch an event's QR code.
      security:
        - bearerAuth: []
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 64
            maximum: 2048
            default: 512
      responses:
        "200":
          description: PNG image
          headers:
            Cache-Control:
              description: Always `public, max-age=3600`.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/qr.svg:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventQRSVG
      summary: Download the event's QR code as an SVG
      description: |
        Encodes the canonical public gallery URL as vector graphics. Only the
        owning operator can fetch an event's QR code.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SVG image
          headers:
            Cache-Control:
              description: Always `public, max-age=3600`.
              schema:
                type: string
          content:
            image/svg+xml:
              schema:
                type: string
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/photos:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Photos]
      operationId: listEventPhotos
      summary: List an event's photos for its owner
      description: |
        Cursor-paginated, newest first, includes photos in every processing
        state (unlike the public gallery, which lists READY photos only).
        Accepts an operator JWT or a device key assigned to the event.
      security:
        - bearerAuth: []
        - deviceKey: []
      parameters:
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          description: Optional processing status filter
          schema:
            $ref: "#/components/schemas/PhotoStatus"
      responses:
        "200":
          description: A page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoListEnvelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid cursor, limit, or status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/uploads:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Uploads]
      operationId: initializeUpload
      summary: Initialize a photo upload and receive presigned URL(s)
      description: |
        Accepts an operator JWT (any owned event) or a device key assigned to
        the target event. Devices may only initialize uploads for their
        assigned event; other events return 404.
      security:
        - bearerAuth: []
        - deviceKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeUploadRequest"
      responses:
        "201":
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeUploadEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error (unsupported type, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Uploads]
      operationId: getUploadStatus
      summary: Poll the status of an upload (for resume/recovery)
      security:
        - bearerAuth: []
        - deviceKey: []
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusEnvelope"
        "404":
          description: Photo not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/url:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: represignSimpleUpload
      summary: Re-issue a presigned PUT for an interrupted simple upload
      description: |
        Only for simple uploads still in the UPLOADING state. Multipart
        uploads re-request part URLs from `/uploads/{photoID}/parts` instead.
      security:
        - bearerAuth: []
        - deviceKey: []
      responses:
        "200":
          description: A fresh presigned PUT URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUploadEnvelope"
        "404":
          description: Photo not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Not a simple upload, or the photo is no longer uploading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/parts:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: getUploadPartURLs
      summary: Get presigned URLs for multipart part numbers
      security:
        - bearerAuth: []
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPartURLsRequest"
      responses:
        "200":
          description: Presigned part URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartURLsEnvelope"
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/multipart/complete:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: completeMultipartUpload
      summary: Complete a multipart upload with the uploaded part ETags
      security:
        - bearerAuth: []
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMultipartRequest"
      responses:
        "200":
          description: Multipart upload completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/multipart/abort:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: abortMultipartUpload
      summary: Abort a multipart upload
      security:
        - bearerAuth: []
        - deviceKey: []
      responses:
        "204":
          description: Aborted
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/complete:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Verify the uploaded object and mark the photo ready for processing
      security:
        - bearerAuth: []
        - deviceKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusEnvelope"
        "404":
          description: Photo or object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Idempotency conflict or invalid upload state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Object size mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /photos/{photoID}/url:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Photos]
      operationId: getPhotoURL
      summary: Get a short-lived signed URL for an owned photo variant
      description: |
        Owner/device access to a photo, including photos still processing
        (for variants that exist) and originals regardless of the event's
        guest-facing download settings. Responses are never cached.
      security:
        - bearerAuth: []
        - deviceKey: []
      parameters:
        - name: variant
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PhotoVariant"
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURLEnvelope"
        "404":
          description: Photo not found, or the requested variant is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /photos/{photoID}:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    delete:
      tags: [Photos]
      operationId: deletePhoto
      summary: Delete a photo and enqueue cleanup of its stored objects
      description: |
        Removes the photo row, aborts any in-progress multipart upload, and
        enqueues an object cleanup job for the original and its derivatives.
        Event counters are decremented exactly once.
      security:
        - bearerAuth: []
        - deviceKey: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Photo not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /devices:
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Register a photobooth device and issue its API key
      description: |
        The raw API key is returned exactly once, in this response. Only its
        SHA-256 hash is stored; store the key on the device immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device created; the key is shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithKeyEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Assigned event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the authenticated operator's devices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All devices, including revoked ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /devices/{deviceID}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Rename a device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnvelope"
        "404":
          description: Device not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device key (kept for audit)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
        "404":
          description: Device not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /devices/{deviceID}/rotate:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      tags: [Devices]
      operationId: rotateDeviceKey
      summary: Rotate a device key
      description: Invalidates the previous key immediately and returns the new key once.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New key issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithKeyEnvelope"
        "404":
          description: Device not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Device has been revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    get:
      tags: [Public Gallery]
      operationId: getPublicEvent
      summary: Get a public event by slug (no auth)
      description: |
        Returns public metadata for a visible event. Private, soft-deleted, or
        expired events return 404 (existence is not revealed). Password events
        return metadata only after unlock; without a valid token the response
        indicates that unlock is required.
      security: []
      responses:
        "200":
          description: Public event metadata
          headers:
            Cache-Control:
              description: |
                `public, max-age=60` for public events; `private, no-store` for
                password events.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventEnvelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/unlock:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    post:
      tags: [Public Gallery]
      operationId: unlockPublicEvent
      summary: Unlock a password-protected gallery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: Correct password; event-scoped unlock token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockResultEnvelope"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    get:
      tags: [Public Gallery]
      operationId: listPublicPhotos
      summary: Cursor-paginated listing of READY photos
      description: |
        Returns metadata only; image URLs are not embedded. Fetch a signed URL
        per photo and variant from the `/url` endpoint. Only `READY` photos are
        listed.
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of public photos
          headers:
            Cache-Control:
              description: |
                `public, max-age=60` for public events; `private, no-store` for
                password events.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPhotoListEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos/{photoID}:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Public Gallery]
      operationId: getPublicPhoto
      summary: Get one READY photo's metadata
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
      responses:
        "200":
          description: Public photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPhotoEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event or photo not found, or photo not READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos/{photoID}/url:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Public Gallery]
      operationId: getPublicPhotoURL
      summary: Get a short-lived signed URL for a photo variant
      description: |
        Returns a presigned GET URL valid for `SIGNED_URL_TTL` (default 5
        minutes). `original` requires `allow_original_download`; any download
        requires `allow_download`. Responses are never cached.
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
        - name: variant
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PhotoVariant"
      responses:
        "200":
          description: Signed URL
          headers:
            Cache-Control:
              description: Always `private, no-store` (URL carries credentials).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURLEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          description: Downloads disabled or original download disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event or photo not found, or photo not READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Device API key issued by `POST /devices` (format `cpd_live_<prefix>_<secret>`).
        `Authorization: Device <key>` is also accepted.
  parameters:
    EventID:
      name: eventID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventSlug:
      name: slug
      in: path
      required: true
      description: URL slug of the event, unique per operator.
      schema:
        type: string
        maxLength: 255
    UnlockToken:
      name: X-Gallery-Unlock
      in: header
      required: false
      description: |
        Event-scoped unlock token returned by `/public/events/{slug}/unlock`.
        Required for `password` events; ignored for `public` events.
      schema:
        type: string
    PhotoID:
      name: photoID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceID:
      name: deviceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-supplied key; repeating it with the same body returns the original result.
      schema:
        type: string
        maxLength: 255
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        businessName:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        businessName:
          type: string
    AuthEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthResponse"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    ProfileEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Branding:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
          description: Short-lived signed URL for the uploaded logo, if any.
        profileImageUrl:
          type: ["string", "null"]
          description: Short-lived signed URL for the uploaded profile image, if any.
        primaryColor:
          type: ["string", "null"]
          description: Lowercase `#rrggbb` hex color.
        secondaryColor:
          type: ["string", "null"]
          description: Lowercase `#rrggbb` hex color.
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
          format: date-time
    BrandingEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Branding"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    BrandingUpdateRequest:
      type: object
      description: |
        Partial update; omitted fields are unchanged, empty strings clear.
        `logoKey`/`profileImageKey` must be keys returned by
        `POST /account/branding/assets`.
      properties:
        businessName:
          type: string
          maxLength: 255
        logoKey:
          type: string
        profileImageKey:
          type: string
        primaryColor:
          type: string
          description: Hex color like `#1a2b3c`; empty string clears.
        secondaryColor:
          type: string
        contactEmail:
          type: string
          maxLength: 320
        contactPhone:
          type: string
          maxLength: 40
        websiteUrl:
          type: string
          maxLength: 320
    BrandingAssetRequest:
      type: object
      required: [kind, contentType]
      properties:
        kind:
          type: string
          enum: [logo, profileImage]
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
    BrandingAsset:
      type: object
      required: [uploadUrl, storageKey, expiresAt]
      properties:
        uploadUrl:
          type: string
          description: Presigned PUT URL. Upload bytes directly to storage.
        storageKey:
          type: string
          description: Object key to send back via `PATCH /account/branding`.
        expiresAt:
          type: string
          format: date-time
    BrandingAssetEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/BrandingAsset"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Envelope:
      type: object
      properties:
        data: {}
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    EventStatus:
      type: string
      enum: [upcoming, active, completed, archived]
    EventVisibility:
      type: string
      enum: [public, password, private]
    Event:
      type: object
      required:
        [
          id,
          name,
          slug,
          status,
          eventDate,
          storageBytes,
          photoCount,
          guestCount,
          expiresAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        location:
          type: string
        description:
          type: string
        eventDate:
          type: ["string", "null"]
          format: date
        status:
          $ref: "#/components/schemas/EventStatus"
        coverPhotoId:
          type: ["string", "null"]
          format: uuid
        storageBytes:
          type: integer
          format: int64
        photoCount:
          type: integer
          format: int64
        guestCount:
          type: integer
          format: int64
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventSettings:
      type: object
      required:
        [
          eventId,
          visibility,
          passwordProtected,
          allowDownload,
          allowOriginalDownload,
          watermarkEnabled,
          updatedAt,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/EventVisibility"
        passwordProtected:
          type: boolean
        allowDownload:
          type: boolean
        allowOriginalDownload:
          type: boolean
        watermarkEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    EventSettingsInput:
      type: object
      properties:
        visibility:
          $ref: "#/components/schemas/EventVisibility"
        password:
          type: string
          description: Set a gallery password; empty string clears it
        allowDownload:
          type: boolean
        allowOriginalDownload:
          type: boolean
        watermarkEnabled:
          type: boolean
    CreateEventRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        eventDate:
          type: string
          format: date
        clientName:
          type: string
          maxLength: 255
        clientEmail:
          type: string
          format: email
          maxLength: 320
        location:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        expiresAt:
          type: string
          format: date-time
        settings:
          $ref: "#/components/schemas/EventSettingsInput"
    UpdateEventRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        eventDate:
          type: string
          format: date
          description: Empty string clears the date
        clientName:
          type: string
        clientEmail:
          type: string
          format: email
        location:
          type: string
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Empty string clears the expiry
    UpdateEventSettingsRequest:
      $ref: "#/components/schemas/EventSettingsInput"
    EventDashboard:
      type: object
      required: [photoCount, storageBytes, guestCount]
      properties:
        photoCount:
          type: integer
          format: int64
        storageBytes:
          type: integer
          format: int64
        guestCount:
          type: integer
          format: int64
    EventEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Event"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EventWithSettings:
      type: object
      required: [event, settings]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        settings:
          $ref: "#/components/schemas/EventSettings"
    EventWithSettingsEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EventWithSettings"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        nextCursor:
          type: ["string", "null"]
    EventListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EventList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EventSettingsEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EventSettings"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EventDashboardEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EventDashboard"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EventURL:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Canonical public gallery URL (`<PUBLIC_BASE_URL>/e/{slug}`).
    EventURLEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EventURL"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    PhotoStatus:
      type: string
      enum: [UPLOADING, PROCESSING, READY, FAILED]
    Photo:
      type: object
      required:
        [
          id,
          filename,
          mimeType,
          fileSize,
          width,
          height,
          status,
          variants,
          errorMessage,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          format: int64
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        status:
          $ref: "#/components/schemas/PhotoStatus"
        variants:
          type: array
          description: Derivative variants that exist for this photo.
          items:
            $ref: "#/components/schemas/PhotoVariant"
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    PhotoList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextCursor:
          type: ["string", "null"]
    PhotoListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PhotoList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    UploadKind:
      type: string
      enum: [simple, multipart]
    InitializeUploadRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
    InitializeUpload:
      type: object
      required:
        [photoId, uploadKind, uploadUrl, storageKey, expiresAt, partSize]
      properties:
        photoId:
          type: string
          format: uuid
        uploadKind:
          $ref: "#/components/schemas/UploadKind"
        uploadUrl:
          type: string
          description: Presigned PUT URL (simple uploads). Null for multipart.
        storageKey:
          type: string
        expiresAt:
          type: string
          format: date-time
        partSize:
          type: ["integer", "null"]
          format: int64
          description: Required part size for multipart uploads.
    InitializeUploadEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InitializeUpload"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    PresignedUpload:
      type: object
      required: [uploadUrl, expiresAt]
      properties:
        uploadUrl:
          type: string
          description: Presigned PUT URL.
        expiresAt:
          type: string
          format: date-time
    PresignedUploadEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PresignedUpload"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    UploadPartURLsRequest:
      type: object
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: integer
            minimum: 1
            maximum: 10000
    PartURL:
      type: object
      required: [partNumber, url]
      properties:
        partNumber:
          type: integer
        url:
          type: string
    UploadPartURLs:
      type: object
      required: [photoId, partSize, parts]
      properties:
        photoId:
          type: string
          format: uuid
        partSize:
          type: integer
          format: int64
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartURL"
    UploadPartURLsEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UploadPartURLs"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    CompletedPart:
      type: object
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
    CompleteMultipartRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CompletedPart"
    UploadStatus:
      type: object
      required:
        [
          photoId,
          eventId,
          status,
          uploadKind,
          filename,
          mimeType,
          fileSize,
          errorMessage,
          createdAt,
          updatedAt,
        ]
      properties:
        photoId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PhotoStatus"
        uploadKind:
          $ref: "#/components/schemas/UploadKind"
        filename:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          format: int64
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UploadStatusEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UploadStatus"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Device:
      type: object
      required: [id, name, keyPrefix, assignedEventId, revokedAt, lastUsedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: First half of the key, used for lookup. Not secret.
        assignedEventId:
          type: ["string", "null"]
          format: uuid
          description: Event this device may upload to; null means no upload scope.
        revokedAt:
          type: ["string", "null"]
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    DeviceWithKey:
      type: object
      required: [device, key]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        key:
          type: string
          description: Raw API key. Returned only by create and rotate.
    CreateDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        assignedEventId:
          type: string
          format: uuid
          description: Optional event the device may upload to.
    UpdateDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    DeviceEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Device"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    DeviceWithKeyEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DeviceWithKey"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    DeviceListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DeviceList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    PhotoVariant:
      type: string
      enum: [thumbnail, medium, large, original]
      description: |
        `thumbnail`, `medium`, `large` are generated derivatives; `original` is
        the uploaded file and is gated by `allow_original_download`.
    PublicEvent:
      type: object
      properties:
        name:
          type: string
        date:
          type: ["string", "null"]
          format: date
        location:
          type: string
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/EventVisibility"
        allowDownload:
          type: boolean
        allowOriginalDownload:
          type: boolean
        photoCount:
          type: integer
          format: int64
        coverPhotoId:
          type: ["string", "null"]
          format: uuid
        requiresUnlock:
          type: boolean
          description: True when the event is password-protected and no valid unlock token was supplied.
        branding:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PublicBranding"
    PublicBranding:
      type: object
      description: |
        Tenant branding for the public gallery. All fields are nullable; the
        gallery falls back to event metadata and default theme tokens. `logoUrl`
        is a short-lived signed URL that stays valid for longer than the 60 s
        metadata cache.
      properties:
        businessName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
          description: Lowercase `#rrggbb` hex color.
        secondaryColor:
          type: ["string", "null"]
          description: Lowercase `#rrggbb` hex color.
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
    PublicEventEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PublicEvent"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    UnlockRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    UnlockResult:
      type: object
      properties:
        token:
          type: string
          description: Event-scoped unlock token; send via the `X-Gallery-Unlock` header.
        expiresIn:
          type: integer
          description: Token lifetime in seconds.
    UnlockResultEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UnlockResult"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    PublicPhoto:
      type: object
      description: Metadata only; image URLs are fetched per variant from the `/url` endpoint.
      properties:
        id:
          type: string
          format: uuid
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        variants:
          type: array
          description: Derivative variants available for download.
          items:
            $ref: "#/components/schemas/PhotoVariant"
    PublicPhotoEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PublicPhoto"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    PublicPhotoList:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/PublicEvent"
        photos:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PublicPhoto"
            nextCursor:
              type: ["string", "null"]
    PublicPhotoListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PublicPhotoList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    SignedURL:
      type: object
      required: [url, expiresIn]
      properties:
        url:
          type: string
          description: Short-lived presigned GET URL. Never cached or logged.
        expiresIn:
          type: integer
          description: URL lifetime in seconds.
    SignedURLEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SignedURL"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
