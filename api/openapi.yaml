          format: date-time
        partSize:
          type: ["integer", "null"]
          format: int64
          description: Required part size for multipart uploads.
    InitializeUploadEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InitializeUpload"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
