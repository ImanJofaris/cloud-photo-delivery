openapi: 3.1.0
info:
  title: Cloud Photo Delivery API
  version: 0.5.0
  description: API-first backend for the Cloud Photo Delivery SaaS.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Events
  - name: Uploads
  - name: Public Gallery
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe (checks database)
      security: []
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready

  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Register a new operator account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "423":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/password/reset-request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset email (always returns 200)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/password/reset-confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /account/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events:
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithSettingsEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "402":
          description: Active event limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    get:
      tags: [Events]
      operationId: listEvents
      summary: List the authenticated operator's events
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: q
          in: query
          description: Case-insensitive search on the event name
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid status or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get one event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update event fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Soft delete an event
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/archive:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Events]
      operationId: archiveEvent
      summary: Archive an event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Archived event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/settings:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventSettings
      summary: Get an event's gallery settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettingsEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      tags: [Events]
      operationId: updateEventSettings
      summary: Update an event's gallery settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettingsEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/dashboard:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEventDashboard
      summary: Get an event's dashboard aggregates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDashboardEnvelope"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /events/{eventID}/uploads:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Uploads]
      operationId: initializeUpload
      summary: Initialize a photo upload and receive presigned URL(s)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeUploadRequest"
      responses:
        "201":
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeUploadEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error (unsupported type, too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Uploads]
      operationId: getUploadStatus
      summary: Poll the status of an upload (for resume/recovery)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusEnvelope"
        "404":
          description: Photo not found (also for other tenants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/parts:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: getUploadPartURLs
      summary: Get presigned URLs for multipart part numbers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPartURLsRequest"
      responses:
        "200":
          description: Presigned part URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartURLsEnvelope"
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/multipart/complete:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: completeMultipartUpload
      summary: Complete a multipart upload with the uploaded part ETags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMultipartRequest"
      responses:
        "200":
          description: Multipart upload completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/multipart/abort:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: abortMultipartUpload
      summary: Abort a multipart upload
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Aborted
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Photo is not a multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /uploads/{photoID}/complete:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Verify the uploaded object and mark the photo ready for processing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusEnvelope"
        "404":
          description: Photo or object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: Idempotency conflict or invalid upload state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Object size mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    get:
      tags: [Public Gallery]
      operationId: getPublicEvent
      summary: Get a public event by slug (no auth)
      description: |
        Returns public metadata for a visible event. Private, soft-deleted, or
        expired events return 404 (existence is not revealed). Password events
        return metadata only after unlock; without a valid token the response
        indicates that unlock is required.
      security: []
      responses:
        "200":
          description: Public event metadata
          headers:
            Cache-Control:
              description: |
                `public, max-age=60` for public events; `private, no-store` for
                password events.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventEnvelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/unlock:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    post:
      tags: [Public Gallery]
      operationId: unlockPublicEvent
      summary: Unlock a password-protected gallery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: Correct password; event-scoped unlock token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockResultEnvelope"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
    get:
      tags: [Public Gallery]
      operationId: listPublicPhotos
      summary: Cursor-paginated listing of READY photos
      description: |
        Returns metadata only; image URLs are not embedded. Fetch a signed URL
        per photo and variant from the `/url` endpoint. Only `READY` photos are
        listed.
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of public photos
          headers:
            Cache-Control:
              description: |
                `public, max-age=60` for public events; `private, no-store` for
                password events.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPhotoListEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event not found, private, deleted, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos/{photoID}:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Public Gallery]
      operationId: getPublicPhoto
      summary: Get one READY photo's metadata
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
      responses:
        "200":
          description: Public photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPhotoEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event or photo not found, or photo not READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /public/events/{slug}/photos/{photoID}/url:
    parameters:
      - $ref: "#/components/parameters/EventSlug"
      - $ref: "#/components/parameters/PhotoID"
    get:
      tags: [Public Gallery]
      operationId: getPublicPhotoURL
      summary: Get a short-lived signed URL for a photo variant
      description: |
        Returns a presigned GET URL valid for `SIGNED_URL_TTL` (default 5
        minutes). `original` requires `allow_original_download`; any download
        requires `allow_download`. Responses are never cached.
      security: []
      parameters:
        - $ref: "#/components/parameters/UnlockToken"
        - name: variant
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PhotoVariant"
      responses:
        "200":
          description: Signed URL
          headers:
            Cache-Control:
              description: Always `private, no-store` (URL carries credentials).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURLEnvelope"
        "401":
          description: Password event requires a valid unlock token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          description: Downloads disabled or original download disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Event or photo not found, or photo not READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          description: Invalid variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventID:
      name: eventID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventSlug:
      name: slug
      in: path
      required: true
      description: URL slug of the event, unique per operator.
      schema:
        type: string
        maxLength: 255
    UnlockToken:
      name: X-Gallery-Unlock
      in: header
      required: false
      description: |
        Event-scoped unlock token returned by `/public/events/{slug}/unlock`.
        Required for `password` events; ignored for `public` events.
      schema:
        type: string
    PhotoID:
      name: photoID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-supplied key; repeating it with the same body returns the original result.
      schema:
        type: string
        maxLength: 255
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        businessName:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      properties:
