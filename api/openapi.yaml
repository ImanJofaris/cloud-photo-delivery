          $ref: "#/components/schemas/Subscription"
        checkout:
          $ref: "#/components/schemas/CheckoutSession"
    SubscribeResultEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SubscribeResult"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    InvoiceStatus:
      type: string
      enum: [open, paid, void]
    Invoice:
