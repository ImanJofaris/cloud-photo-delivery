          format: uuid
        subscriptionId:
          type: ["string", "null"]
          format: uuid
        amountCents:
          type: integer
        currency:
          type: string
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        providerRef:
          type: ["string", "null"]
        issuedAt:
          type: string
          format: date-time
        paidAt:
          type: ["string", "null"]
          format: date-time
    InvoiceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        nextCursor:
          type: ["string", "null"]
    InvoiceListEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InvoiceList"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    BillingWebhookPayload:
      type: object
