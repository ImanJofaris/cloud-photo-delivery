services:
  postgres:
    image: postgres:16-alpine
    container_name: cpd_postgres
    environment:
      POSTGRES_USER: cpd
      POSTGRES_PASSWORD: cpd
      POSTGRES_DB: cpd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpd -d cpd"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: cpd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: quay.io/minio/mc:latest
    container_name: cpd_createbucket
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/cpd-photos;
      mc anonymous set download local/cpd-photos || true;
      echo 'bucket ready';
      "

  api:
    build:
      context: .
      args:
        TARGET: api
    container_name: cpd_api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://cpd:cpd@postgres:5432/cpd?sslmode=disable
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY: minioadmin
      R2_SECRET_KEY: minioadmin
      R2_BUCKET: cpd-photos
      R2_REGION: auto
      JWT_SECRET: dev-only-change-me
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      args:
        TARGET: worker
    container_name: cpd_worker
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://cpd:cpd@postgres:5432/cpd?sslmode=disable
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY: minioadmin
      R2_SECRET_KEY: minioadmin
      R2_BUCKET: cpd-photos
      R2_REGION: auto
      JWT_SECRET: dev-only-change-me
      WORKER_CONCURRENCY: "2"
      WORKER_POLL_INTERVAL: 1s

volumes:
  pgdata:
  miniodata:
