run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gofmt
    - goimports
    - bodyclose
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/imanjofaris/cloud-photo-delivery

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - noctx
